name: Update official PENNY DEL schedule

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_schedule.py"
      - ".github/workflows/update-schedule.yml"

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pypdf

      - name: Import official PENNY DEL schedule
        run: python scripts/update_schedule.py

      - name: Commit updated schedule
        run: |
          git config user.name "PuckBoss Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/games.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update PENNY DEL schedule"
            git push
          fi
