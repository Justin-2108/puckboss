name: Remove temporary test game

on:
  push:
    paths:
      - ".github/workflows/remove-test-game.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove temporary test game
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/data/games.json")
          games = json.loads(path.read_text(encoding="utf-8"))
          test_id = "test-2026-09-07-1930-eisbaeren-berlin-straubing-tigers"
          cleaned = [game for game in games if game.get("id") != test_id]
          if len(cleaned) == len(games):
              raise SystemExit("Temporary test game not found")
          path.write_text(json.dumps(cleaned, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Remove cleanup workflow and commit
        run: |
          rm -f .github/workflows/remove-test-game.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/games.json .github/workflows/remove-test-game.yml
          git commit -m "Remove temporary test game"
          git push
