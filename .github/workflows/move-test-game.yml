name: Prepare PuckBoss test game

on:
  push:
    paths:
      - ".github/workflows/move-test-game.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set test game to future date
        run: |
          python - <<'PY'
          import json
          path='docs/data/games.json'
          with open(path, encoding='utf-8') as f: games=json.load(f)
          for g in games:
              if g.get('phase') == 'test':
                  g['date']='2026-09-30'
                  g['dateTime']='2026-09-30T19:30:00'
                  g['time']='19:30'
                  g['status']='scheduled'
                  g['homeScore']=None
                  g['awayScore']=None
                  g['overtime']=False
          with open(path,'w',encoding='utf-8') as f:
              json.dump(games,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          git config user.name "PuckBoss Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/games.json
          git commit -m "Prepare future test game"
          git push
