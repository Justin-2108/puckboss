name: Deploy Firestore rules

on:
  workflow_dispatch:
  push:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/firestore-rules-deploy-trigger"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Firestore rules with Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          PROJECT_ID=$(node -e "console.log(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT).project_id)")
          echo "Deploying Firestore rules to project: $PROJECT_ID"
          npx --yes firebase-tools@latest deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
