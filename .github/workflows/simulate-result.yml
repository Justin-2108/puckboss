name: Simulate test result

on:
  push:
    paths:
      - ".github/workflows/simulate-result.yml"

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set test result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/data/games.json")
          games = json.loads(path.read_text(encoding="utf-8"))
          target = games[0]
          target["homeScore"] = 4
          target["awayScore"] = 2
          target["status"] = "finished"
          target["overtime"] = False
          path.write_text(json.dumps(games, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Simulated result: {target['home']} {target['homeScore']}:{target['awayScore']} {target['away']}")
          PY

      - name: Commit test result
        run: |
          git config user.name "PuckBoss Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/games.json
          git commit -m "Simulate test result"
          git push
