name: Restore test schedule

on:
  push:
    paths:
      - ".github/workflows/restore-test-schedule.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore official schedule and add test game
        run: |
          git fetch origin db710103439627ceee597162bc607f16d941b6eb --depth=1
          git checkout db710103439627ceee597162bc607f16d941b6eb -- docs/data/games.json
          python - <<'PY'
          import json
          path = 'docs/data/games.json'
          with open(path, encoding='utf-8') as f:
              games = json.load(f)
          games.insert(0, {
              'id': 'test-2026-09-07-1930-eisbaeren-berlin-straubing-tigers',
              'season': '2026/27',
              'phase': 'test',
              'round': 0,
              'playoffRound': None,
              'seriesId': None,
              'gameNumber': None,
              'date': '2026-09-07',
              'dateTime': '2026-09-07T19:30:00',
              'time': '19:30',
              'home': 'Eisbären Berlin',
              'away': 'Straubing Tigers',
              'homeScore': None,
              'awayScore': None,
              'status': 'scheduled',
              'overtime': False
          })
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(games, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit restored schedule
        run: |
          git config user.name "PuckBoss Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/games.json
          git commit -m "Restore official schedule and add test game"
          git push
