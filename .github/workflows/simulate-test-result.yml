name: Simulate test result

on:
  push:
    paths:
      - ".github/workflows/simulate-test-result.yml"

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set test result to 5:2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/data/games.json")
          games = json.loads(path.read_text(encoding="utf-8"))
          test_id = "test-2026-09-07-1930-eisbaeren-berlin-straubing-tigers"

          for game in games:
              if game.get("id") == test_id:
                  game["homeScore"] = 5
                  game["awayScore"] = 2
                  game["status"] = "finished"
                  game["overtime"] = False
                  break
          else:
              raise SystemExit("Test game not found")

          path.write_text(json.dumps(games, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Sync result to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install google-cloud-firestore google-auth
          python scripts/sync_firestore.py

      - name: Commit result and remove temporary workflow
        run: |
          rm -f .github/workflows/simulate-test-result.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/games.json .github/workflows/simulate-test-result.yml
          git commit -m "Simulate test result 5-2" || exit 0
          git push
