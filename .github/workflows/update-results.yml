name: Update PENNY DEL results

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_results.py"
      - ".github/workflows/update-results.yml"

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Import official PENNY DEL results
        run: python scripts/update_results.py

      - name: Commit updated results
        run: |
          git config user.name "PuckBoss Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/games.json
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "Update PENNY DEL results"
            git push
          fi
